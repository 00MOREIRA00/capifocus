<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Timer pomodoro com uma capivara street e lo-fi gerado no navegador.">
<meta name="theme-color" content="#a28bd4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23a28bd4'/%3E%3Cpath d='M9 21 C9 13 14 10 20 10 C26 10 31 13 31 21 L31.5 26 C31.5 31 26 34 20 34 C14 34 8.5 31 8.5 26 Z' fill='%23b57e52'/%3E%3Cellipse cx='20' cy='28' rx='8' ry='5' fill='%239a643c'/%3E%3Crect x='16' y='24' width='8' height='3.6' rx='1.8' fill='%233a2416'/%3E%3Ccircle cx='15' cy='20' r='1.5' fill='%2322140b'/%3E%3Ccircle cx='25' cy='20' r='1.5' fill='%2322140b'/%3E%3Cpath d='M12 14 C12 6 28 6 28 14 Z' fill='%23f2c14e'/%3E%3Cellipse cx='20' cy='14' rx='12' ry='2.6' fill='%23e3ad35'/%3E%3C/svg%3E">
<title>Capifocus</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: uma coluna central estreita, como um app de foco; cor de fundo muda por modo. Visual único (roxo claro), sem tema escuro. */
:root{
  --bg:#a28bd4;          /* pomodoro: lavanda */
  --bg-deep:#8f76c6;
  --panel:rgba(255,255,255,.14);
  --panel-strong:rgba(255,255,255,.22);
  --ink:#ffffff;
  --ink-soft:rgba(255,255,255,.78);
  --accent-ink:#6f55ad;  /* texto do botão principal */
  --capy:#a8744a; --capy-dark:#8a5b37; --capy-ink:#2e1c10; --yuzu:#f4b04a; --leaf:#7fb069;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
/* tema: cada modo lê suas próprias variáveis (trocadas pelo seletor de tema) */
:root{--bg-pomo:#a28bd4;--acc-pomo:#6f55ad;--bg-short:#8f9be0;--acc-short:#5662b0;--bg-long:#b78ad6;--acc-long:#8150a6}
body.pomo{--bg:var(--bg-pomo);--accent-ink:var(--acc-pomo)}
body.short{--bg:var(--bg-short);--accent-ink:var(--acc-short)}
body.long{--bg:var(--bg-long);--accent-ink:var(--acc-long)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);transition:background-color .6s ease;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 48px;display:flex;flex-direction:column;gap:22px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.18);position:relative}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.2px}
.logo svg{width:30px;height:30px}
.hbtns{display:flex;gap:8px}
.hbtn{font:600 13px var(--body);color:var(--ink);background:var(--panel-strong);border:0;border-radius:6px;padding:7px 12px;cursor:pointer}
.hbtn.icon{width:36px;height:34px;padding:0;display:grid;place-items:center}
.hbtn.icon svg{width:20px;height:20px;transition:transform .4s}
.hbtn.icon:hover svg{transform:rotate(60deg)}
.hbtn.icon[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.hbtn.icon[aria-expanded="true"] svg{transform:rotate(180deg)}
.hbtn.icon svg{transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
/* painel de ajustes: flutua sobre a página, saindo da engrenagem */
header{z-index:60}
.settings-wrap{position:fixed;inset:0;z-index:50;visibility:hidden;transition:visibility 0s linear .4s}
.settings-wrap.open{visibility:visible;transition:visibility 0s}
.sback{position:absolute;inset:0;background:rgba(25,15,45,.3);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;transition:opacity .35s ease}
.settings-wrap.open .sback{opacity:1}
.sclip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;width:min(480px,100%);transform:translateX(-50%);padding:0 16px;box-sizing:border-box}
.settings-wrap .settings{max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);overflow-y:auto;opacity:0;transform:translateY(-12px) scale(.94);transform-origin:top right;
  transition:opacity .25s ease,transform .4s cubic-bezier(.2,.9,.25,1.15)}
.settings-wrap.open .settings{opacity:1;transform:none;transition:opacity .2s ease,transform .45s cubic-bezier(.2,.9,.25,1.15)}
.settings-wrap .settings>*{opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .3s ease}
.settings-wrap.open .settings>*{opacity:1;transform:none}
.settings-wrap.open .settings>:nth-child(1){transition-delay:.08s}.settings-wrap.open .settings>:nth-child(2){transition-delay:.12s}
.settings-wrap.open .settings>:nth-child(3){transition-delay:.16s}.settings-wrap.open .settings>:nth-child(4){transition-delay:.2s}
.settings-wrap.open .settings>:nth-child(5){transition-delay:.24s}.settings-wrap.open .settings>:nth-child(6){transition-delay:.28s}
.settings-wrap.open .settings>:nth-child(7){transition-delay:.32s}
.hbtn:hover{background:rgba(255,255,255,.3)}
.progress{position:absolute;left:0;bottom:-1px;height:3px;background:var(--ink);border-radius:2px;width:0;transition:width .4s linear}

.card{background:var(--panel);border-radius:10px;padding:20px 16px 26px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.tab{font:600 15px var(--body);color:var(--ink);background:transparent;border:0;border-radius:6px;padding:5px 12px;cursor:pointer}
.tab[aria-pressed="true"]{background:rgba(0,0,0,.14);font-weight:800}
.time{font-family:var(--display);font-weight:600;font-size:clamp(84px,24vw,120px);line-height:1;letter-spacing:1px;font-variant-numeric:tabular-nums;margin-top:6px}
.controls{display:flex;align-items:center;gap:22px;margin-top:14px;position:relative}
.main{font:800 22px var(--display);letter-spacing:1.5px;text-transform:uppercase;color:var(--btn-fg,var(--accent-ink));background:var(--btn-bg,var(--ink));border:0;border-radius:8px;width:200px;height:56px;cursor:pointer;box-shadow:0 6px 0 var(--btn-shadow,rgba(235,235,245,.9));transition:transform .08s,box-shadow .08s,color .6s}
.main.running{transform:translateY(6px);box-shadow:none}
.skip{background:none;border:0;color:var(--ink);cursor:pointer;padding:6px;opacity:.9;position:absolute;right:-52px}
.skip[hidden]{display:none!important}
.skip.reset{right:auto;left:-52px}
.skip:hover{opacity:1}
.skip svg{width:26px;height:26px;display:block}

.capy-stage{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.capy{width:230px;max-width:100%;height:auto}
.count{font-weight:700;color:var(--ink-soft);font-size:15px}
.msg{font-weight:600;font-size:18px}
.doing{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.6px;text-transform:uppercase}
/* cenas: cada modo tem seus objetos; as animações só rodam com o timer ligado */
.capy *{transform-box:fill-box}
.prop{opacity:0;transition:opacity .4s}
body.pomo .prop-pomo, body.short .prop-short, body.long .prop-long{opacity:1}
.eye-open{transition:opacity .3s} .eye-closed{opacity:0;transition:opacity .3s}
.eye-open ellipse{transform-origin:center}
body.short .eye-open, body.long .eye-open{opacity:0}
body.short .eye-closed{opacity:1}
body.pomo .eye-open ellipse{animation:blink 5s infinite}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.breath{transform-origin:center bottom;animation:breath 4s ease-in-out infinite}
@keyframes breath{50%{transform:scaleY(1.02)}}
.head{transform-origin:center bottom;transition:transform .4s}
.zzz,.heart,.steam,.note{opacity:0}
.zzz{font-family:var(--display);font-weight:600;fill:var(--ink)}

/* Pomodoro: balançando a cabeça no ritmo */
body.pomo.running .head{animation:nod .9s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(1px)}}
body.pomo.running .note{animation:rise 2.4s ease-out infinite}
body.pomo.running .note:nth-of-type(2){animation-delay:.8s}
body.pomo.running .note:nth-of-type(3){animation-delay:1.6s}

/* Pausa curta: bubble tea */
body.short.running .boba{animation:sip 1.6s ease-in-out infinite}
@keyframes sip{50%{transform:translateY(-4px)}}
body.short.running .mouth{animation:slurp 1.6s ease-in-out infinite;transform-origin:center}
@keyframes slurp{50%{transform:scale(.8,1.2)}}
body.short.running .heart{animation:rise 2.6s ease-out infinite}
body.short.running .heart:nth-of-type(2){animation-delay:1.3s}
body.short .head{transform:rotate(4deg)}

/* Pausa longa: ofurô de óculos escuros */
body.long .head{transform:rotate(-5deg)}
body.long.running .zzz{animation:zz 2.6s ease-in-out infinite}
body.long.running .zzz:nth-of-type(2){animation-delay:.6s}
body.long.running .steam{animation:steam 3s ease-in-out infinite}
body.long.running .steam:nth-of-type(2){animation-delay:1s}
body.long.running .steam:nth-of-type(3){animation-delay:2s}
body.long.running .float{animation:bob 2.2s ease-in-out infinite}
body.long.running .float:nth-of-type(2){animation-delay:.7s}
@keyframes bob{50%{transform:translateY(-3px) rotate(8deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}35%{opacity:.75}100%{opacity:0;transform:translateY(-22px)}}
@keyframes zz{0%{opacity:0;transform:translateY(4px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
@keyframes rise{0%{opacity:0;transform:translateY(4px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translateY(-24px) scale(1)}}

.tasks-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:2px solid rgba(255,255,255,.6)}
.tasks-head h2{font:700 18px var(--display);margin:0}
.tasks{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:12px;background:#fff;color:#4a3d63;border-radius:8px;padding:14px 14px 14px 12px;cursor:pointer;border-left:6px solid transparent;box-shadow:0 8px 18px rgba(60,30,110,.12)}
.task.active{border-left-color:#4a3d63}
.task .chk{flex:none;width:24px;height:24px;border-radius:50%;border:0;background:#ddd6ec;cursor:pointer;display:grid;place-items:center;color:#fff}
.task.done .chk{background:var(--accent-ink)}
.task .name{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.task.done .name{text-decoration:line-through;opacity:.5}
.task .pom{font-weight:700;color:#a99cc0;font-variant-numeric:tabular-nums;white-space:nowrap}
.task .pom b{color:#6d5f86;font-size:17px}
.task .del{background:none;border:0;color:#b8afc9;font-size:20px;cursor:pointer;line-height:1;padding:0 2px}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:700 15px var(--body);color:var(--ink-soft);background:rgba(0,0,0,.08);border:2px dashed rgba(255,255,255,.45);border-radius:8px;padding:18px;cursor:pointer}
.add:hover{color:var(--ink);background:rgba(0,0,0,.12)}
form.newtask{background:#fff;color:#4a3d63;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
form.newtask input[type=text]{font:700 18px var(--body);border:0;outline:0;color:#4a3d63;padding:6px 0}
form.newtask label{font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
form.newtask input[type=number]{width:70px;font:700 15px var(--body);background:#efebf6;border:0;border-radius:6px;padding:8px;color:#4a3d63}
.frow{display:flex;justify-content:flex-end;gap:8px}
.btn-ghost{font:700 14px var(--body);background:none;border:0;color:#8c80a3;cursor:pointer;padding:8px 12px}
.btn-dark{font:700 14px var(--body);background:#3f3456;color:#fff;border:0;border-radius:6px;cursor:pointer;padding:8px 16px}
.summary{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;background:rgba(255,255,255,.12);border-top:1px solid rgba(255,255,255,.4);padding:14px;border-radius:0 0 8px 8px;font-weight:600;color:var(--ink-soft)}
.summary b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}

.settings{background:#fff;color:#4a3d63;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(60,30,110,.25)}
.settings h3{margin:0;font:700 16px var(--display);color:#8c80a3;text-transform:uppercase;letter-spacing:1px}
.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.srow label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#8c80a3}
.srow input{font:700 16px var(--body);background:#efebf6;border:0;border-radius:6px;padding:9px;color:#4a3d63;width:100%;box-sizing:border-box}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.task button:focus-visible, .settings input:focus-visible, form.newtask input:focus-visible{outline-color:var(--accent-ink)}
.player{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-radius:12px;padding:10px 14px}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--btn-bg,var(--ink));color:var(--btn-fg,var(--accent-ink));display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 rgba(235,235,245,.85);transition:transform .08s,box-shadow .08s,color .6s}
.play:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(235,235,245,.85)}
.play svg{width:20px;height:20px}
.play .i-pause{display:none}
.player.on .play .i-play{display:none}.player.on .play .i-pause{display:block}
.pinfo{flex:1;min-width:120px;display:flex;flex-direction:column;gap:1px}
.pinfo b{font:700 16px var(--display);display:flex;align-items:center;gap:8px}
.pinfo span{font-size:13px;font-weight:600;color:var(--ink-soft)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eq i{display:block;width:3px;height:3px;border-radius:2px;background:currentColor}
.player.on .eq i{animation:eq .9s ease-in-out infinite}
.player.on .eq i:nth-child(2){animation-delay:.2s}.player.on .eq i:nth-child(3){animation-delay:.45s}.player.on .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.tuner{display:flex;align-items:center;gap:2px;margin:2px 0 1px -6px}
.tbtn{width:26px;height:26px;border:0;background:none;color:var(--ink-soft);border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;transition:background .15s,color .15s}
.tbtn:hover{background:rgba(255,255,255,.18);color:var(--ink)}
.tbtn svg{width:16px;height:16px}
.pinfo .st-name{font:600 15px var(--display);color:var(--ink);min-width:112px;text-align:center;white-space:nowrap}
.st-name.swap{animation:swap .3s ease}
@keyframes swap{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pctl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vol{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.vol input{width:90px;accent-color:#fff}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:rgba(128,128,140,.35);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked{background:rgba(255,255,255,.55)}
.switch input:checked::after{transform:translateX(14px);background:var(--accent-ink)}
.arow{display:grid;grid-template-columns:1.5fr .8fr 1.3fr auto;gap:10px;align-items:end}
.arow label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#8c80a3;min-width:0}
.arow select,.arow input[type=number]{font:700 15px var(--body);background:#efebf6;border:0;border-radius:6px;padding:9px;color:#4a3d63;width:100%;box-sizing:border-box}
.arow input[type=range]{accent-color:var(--accent-ink);width:100%;height:36px;margin:0}
.btn-test{font:700 14px var(--body);background:#efebf6;color:#4a3d63;border:0;border-radius:6px;cursor:pointer;padding:9px 14px;height:37px}
.btn-test:hover{background:#e2dbf0}
@media (max-width:440px){.arow{grid-template-columns:1fr 1fr}}
body.ringing .time{animation:ring .5s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg) scale(1.03)}75%{transform:rotate(2deg) scale(1.03)}}
.tcar{position:relative;margin:0 -6px}
.themes{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:6px;scroll-behavior:smooth;scrollbar-width:none;padding:2px 6px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl,0px),#000 calc(100% - var(--fr,0px)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl,0px),#000 calc(100% - var(--fr,0px)),transparent 100%)}
.themes::-webkit-scrollbar{display:none}
.themes>.theme{flex:none;width:68px;scroll-snap-align:start}
.tnav{position:absolute;top:18px;z-index:2;width:28px;height:28px;border-radius:50%;border:0;background:#fff;color:#4a3d63;box-shadow:0 2px 8px rgba(60,30,110,.25);display:grid;place-items:center;cursor:pointer;padding:0;transition:opacity .2s,transform .2s}
.tnav svg{width:15px;height:15px}
.tnav:hover{transform:scale(1.08)}
.tnav.prev{left:-4px}.tnav.next{right:-4px}
.tnav[hidden]{display:grid!important;opacity:0;pointer-events:none}
.theme{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px;cursor:pointer;font:700 12px var(--body);color:#8c80a3;border-radius:10px}
.theme .sw{width:42px;height:42px;border-radius:50%;display:block;border:3px solid transparent;box-shadow:0 0 0 1px rgba(60,30,110,.12);position:relative;overflow:hidden}
.theme[aria-pressed="true"]{color:#4a3d63}
.theme[aria-pressed="true"] .sw{border-color:#4a3d63}
.theme:hover .sw{transform:scale(1.06)}
.theme .sw{transition:transform .15s}
.theme.custom .sw{background:conic-gradient(#e06c6c,#e0b86c,#8ccf7e,#6cc4e0,#7d7ae0,#d27ae0,#e06c6c)}
.theme.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
/* fundos claros (ex.: branco): texto e detalhes escuros */
body.on-light{--ink:#231d30;--ink-soft:rgba(35,29,48,.68);--panel:rgba(35,29,48,.05);--panel-strong:rgba(35,29,48,.09);--btn-bg:#231d30;--btn-fg:#fff;--btn-shadow:rgba(35,29,48,.25)}
body.on-light header{border-bottom-color:rgba(35,29,48,.12)}
body.on-light .hbtn:hover,body.on-light .tbtn:hover{background:rgba(35,29,48,.1)}
body.on-light .tasks-head{border-bottom-color:rgba(35,29,48,.5)}
body.on-light .add{border-color:rgba(35,29,48,.3);background:rgba(35,29,48,.03)}
body.on-light .summary{background:rgba(35,29,48,.04);border-top-color:rgba(35,29,48,.2)}
body.on-light .switch input:checked{background:rgba(35,29,48,.35)}
body.on-light .switch input:checked::after{background:#fff}
body.on-light .vol input{accent-color:#231d30}
body.on-light .task{box-shadow:0 0 0 1px rgba(35,29,48,.1),0 6px 14px rgba(35,29,48,.06)}
body.on-light .settings{box-shadow:0 0 0 1px rgba(35,29,48,.1),0 10px 30px rgba(35,29,48,.12)}
body.on-light button:focus-visible,body.on-light input:focus-visible{outline-color:#231d30}
footer{text-align:center;color:var(--ink-soft);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.skip{right:-44px}.skip.reset{right:auto;left:-44px}.main{width:170px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">

<script>
(function(){
  const $=s=>document.querySelector(s);
  const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

  const MSG={pomo:"Hora de focar!",short:"Hora de uma pausa!",long:"Pausa longa. Relaxa no ofurô."};
  let mins=store.get("capi-mins",{pomo:25,short:5,long:15});
  let tasks=store.get("capi-tasks",[]);
  let activeId=store.get("capi-active",tasks[0]?tasks[0].id:null);
  let count=store.get("capi-count",1);
  let mode="pomo", left=mins.pomo*60, total=left, running=false, endAt=0, tick=null;

  const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  function render(){
    $("#time").textContent=fmt(left);
    $("#progress").style.width=((1-left/total)*100)+"%";
    $("#main").textContent=running?"Pausar":"Começar";
    $("#main").classList.toggle("running",running);
    $("#skip").hidden=!(running||left<total);
    $("#reset").hidden=!(left<total);
    document.body.className=mode+(running?" running":"")+(window.__ring?" ringing":"")+(window.__isLight&&window.__isLight(mode)?" on-light":"");
    const DO={pomo:"No foco, curtindo um lo-fi",short:"Pausa pro bubble tea",long:"Relaxando no ofurô"};
    $("#doing").textContent=running?DO[mode]:"Esperando você começar";
    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-pressed",t.dataset.mode===mode));
    $("#count").textContent="#"+count;
    const a=tasks.find(t=>t.id===activeId);
    $("#msg").textContent=(mode==="pomo"&&a&&!a.done)?a.name:MSG[mode];
  }
  function setMode(m,auto){
    if(running&&!auto)return confirmSwitch(m);
    stop();mode=m;left=total=mins[m]*60;render();
  }
  function confirmSwitch(m){stop();mode=m;left=total=mins[m]*60;render();}
  function start(){running=true;endAt=Date.now()+left*1000;tick=setInterval(step,250);render();}
  function stop(){running=false;clearInterval(tick);render();}
  function step(){
    left=Math.max(0,Math.round((endAt-Date.now())/1000));
    if(left===0){finish();return}
    render();
  }
  var finish=function(){
    stop();if(!skipping)chime();skipping=false;
    if(mode==="pomo"){
      const a=tasks.find(t=>t.id===activeId);if(a){a.act++;saveTasks();}
      const next=(count%4===0)?"long":"short";count++;store.set("capi-count",count);
      setMode(next,true);
    }else setMode("pomo",true);
  }
  let ctx;
  let skipping=false;
  let alarmTimers=[];
  const ALARMS={
    sino:{rep:1.6,play(t,out){[[880,0],[1318.5,.22],[1760,.44]].forEach(([fq,d])=>bell(t+d,fq,1.6,.5,out));}},
    despertador:{rep:1.1,play(t,out){for(let i=0;i<4;i++){beep(t+i*.14,1046,.09,"square",.18,out);}}},
    marimba:{rep:1.4,play(t,out){[523.25,659.25,783.99,1046.5].forEach((fq,i)=>mar(t+i*.13,fq,out));}},
    capi:{rep:1.8,play(t,out){[[392,0],[523.25,.16],[659.25,.32],[523.25,.56],[783.99,.72]].forEach(([fq,d])=>mar(t+d,fq,out));}}
  };
  function bell(t,fq,dec,peak,out){[[1,1],[2.76,.35],[5.4,.12]].forEach(([r,a])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=fq*r;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak*a,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dec/r);o.connect(g).connect(out);o.start(t);o.stop(t+dec+.05);});}
  function beep(t,fq,len,type,peak,out){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=fq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.005);g.gain.setValueAtTime(peak,t+len-.01);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g).connect(out);o.start(t);o.stop(t+len+.02);}
  function mar(t,fq,out){bell(t,fq,.7,.55,out);const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=fq*4;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(g).connect(out);o.start(t);o.stop(t+.1);}
  let alarm=store.get("capi-alarm",{sound:"sino",rep:3,vol:80});
  function chime(){
    try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();
      stopAlarm();
      const A=ALARMS[alarm.sound]||ALARMS.sino,out=ctx.createGain();out.gain.value=alarm.vol/100*1.2;out.connect(ctx.destination);
      const t0=ctx.currentTime+.05;for(let i=0;i<alarm.rep;i++)A.play(t0+i*A.rep,out);
      const total=alarm.rep*A.rep+.6;
      if(typeof Lofi!=="undefined")Lofi.duck(total);
      window.__ring=true;document.body.classList.add("ringing");alarmTimers.push(setTimeout(()=>{window.__ring=false;document.body.classList.remove("ringing")},total*1000));
      alarmTimers.push(out);
    }catch(e){}
  }
  function stopAlarm(){alarmTimers.forEach(x=>{if(typeof x==="number")clearTimeout(x);else try{x.gain.setTargetAtTime(0,ctx.currentTime,.03)}catch(e){}});alarmTimers=[];window.__ring=false;document.body.classList.remove("ringing");}

  $("#main").addEventListener("click",()=>{ensureAudio();stopAlarm(); running?stop():start();});
  $("#skip").addEventListener("click",()=>{skipping=true;left=0;finish();});

  // ---------- Capi Rádio: estações geradas no navegador ----------
  const Lofi=(()=>{
    let c,master,music,dry,wet,wow,lp,lfoG,pumpG,timer=null,stopT=null,next=0,step=0,bar=0,prog=0,noise,on=false,cur="classico";
    const f=m=>440*Math.pow(2,(m-69)/12);
    const pick=a=>a[Math.floor(Math.random()*a.length)];
    // ----- instrumentos -----
    function env(g,t,peak,a,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
    function nz(t,type,freq,peak,dec){const s=c.createBufferSource();s.buffer=noise;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=freq;const g=c.createGain();env(g,t,peak,.003,dec);s.connect(fl).connect(g).connect(dry);s.start(t,Math.random());s.stop(t+dec+.05);}
    function kick(t,v,short){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(short?150:110,t);o.frequency.exponentialRampToValueAtTime(short?50:40,t+(short?.07:.15));env(g,t,v,.004,short?.16:.36);o.connect(g).connect(music);o.start(t);o.stop(t+.42);}
    function tone(t,m,type,peak,a,dec,det,dest,noWow){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f(m);o.detune.value=det||0;if(!noWow)wow.connect(o.detune);env(g,t,peak,a,dec);o.connect(g).connect(dest||dry);o.start(t);o.stop(t+a+dec+.05);}
    function keys(t,notes,len,lvl,a){notes.forEach((m,i)=>{const tt=t+i*.022;tone(tt,m,"triangle",.04*lvl,a||.04,len,-7);tone(tt,m,"sine",.055*lvl,a||.04,len,6);});}
    function rhodes(t,notes,len,lvl){notes.forEach((m,i)=>{const tt=t+i*.018;
      tone(tt,m,"sine",.05*lvl,.008,len,-9,pumpG);tone(tt,m,"sine",.045*lvl,.008,len,9,pumpG);
      tone(tt,m+12,"sine",.014*lvl,.003,.35,0,pumpG);tone(tt,m+24,"sine",.006*lvl,.002,.12,0,pumpG);});}
    function keyLead(t,m,len){tone(t,m,"sine",.075,.004,len,0);tone(t,m+12,"sine",.02,.003,.3,0);tone(t,m-12,"triangle",.018,.006,len*.8,0);}
    function vox(t,m,len,vw){const o=c.createOscillator();o.type="sawtooth";o.frequency.value=f(m);wow.connect(o.detune);
      const F=vw==="a"?[800,1150]:[450,800],g=c.createGain();env(g,t,.05,.04,len);
      F.forEach((fq,j)=>{const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=fq;bp.Q.value=9;const fg=c.createGain();fg.gain.value=j?.6:1;o.connect(bp).connect(fg).connect(g);});
      g.connect(dry);o.start(t);o.stop(t+len+.1);}
    function pump(t){if(!pumpG)return;pumpG.gain.cancelScheduledValues(t);pumpG.gain.setValueAtTime(.4,t);pumpG.gain.linearRampToValueAtTime(1,t+.28);}

    const snare=t=>nz(t,"bandpass",1600,.24,.18), rim=t=>nz(t,"bandpass",3300,.18,.035), brush=t=>nz(t,"bandpass",2600,.09,.32);
    // ----- estações -----
    const ST={
      classico:{nome:"Lo-fi clássico",bpm:72,swing:.3,cut:2000,wobble:500,wet:.32,
        progs:[{ch:[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]],bs:[41,40,38,36]},
               {ch:[[57,60,64,67],[50,53,57,60,64],[55,59,62,65],[48,52,55,59,62]],bs:[45,38,43,36]},
               {ch:[[50,53,57,60],[55,59,62,65],[52,55,59,62],[57,60,64,67]],bs:[38,43,40,45]}],
        play(i,t,ch,r){
          if(i===0||i===7||(i===10&&bar%2===0))kick(t,.85);
          if(i===4||i===12)snare(t);
          if(i%2===0)nz(t,"highpass",7800,i%4===0?.06:.035,.04);
          if(i===0)keys(t,ch,this.spb*3.6,1);

          if(i%2===0&&Math.random()<.16)tone(t,pick([69,72,74,76,79,81]),"sine",.045,.02,this.spb*1.1);
        }},
      anime:{nome:"Anime lo-fi",bpm:82,swing:.22,cut:3800,wobble:350,wet:.34,
        // progressões de J-pop/anime: "marusa" (IVmaj7–III7–vim7–vm7/I7), estrada real (IV–V–iii–VI7) e ii–V–I emotivo
        progs:[{ch:[[53,57,60,64],[52,56,59,62],[57,60,64,67],[55,58,62,65]],bs:[41,40,45,43],half:{3:{ch:[52,55,58,60],bs:36}}},
               {ch:[[53,57,60,64],[55,59,64,65],[52,55,59,62],[55,57,61,64]],bs:[41,43,40,45]},

        scale:[72,74,76,77,79,81,83,84,86,88],
        motif:null,
        newMotif(){
          const T=[[0,3,6,8,10,14,16,19,22,24,28],[2,4,6,10,12,18,20,22,26],[0,4,6,7,8,12,16,20,22,24],[0,2,4,7,10,12,14,18,20,23,26]];

        },
        onLoop(){this.motif=null;},
        play(i,t,ch,r){
          const P=this.progs[prog%this.progs.length];
          if(P.half&&P.half[bar]&&i>=8){ch=P.half[bar].ch;r=P.half[bar].bs;}
          const sp=this.spb;

          if(n){
            let k=n.k+(bar>=2&&Math.random()<.25?1:0);k=Math.min(k,this.scale.length-1);
            let m=this.scale[k];
            const tones=[];ch.forEach(c=>{for(let o=0;o<4;o++){const v=c%12+60+o*12;if(v>=71&&v<=89)tones.push(v);}});
            if(pos%4===0||(bar===3&&pos>=24))m=tones.reduce((a,b)=>Math.abs(b-m)<Math.abs(a-m)?b:a,tones[0]);
            const nx=this.motif.find(x=>x.p>pos),dur=((nx?nx.p:32)-pos)*this.s16;
            keyLead(t,m,Math.min(dur*1.4,sp*1.6));

          if(bar%2===1&&i===12&&Math.random()<.45)vox(t,ch[ch.length-2]+12,sp*1.2,"o");
        }},
      jazz:{nome:"Jazz café",bpm:92,swing:.5,cut:2600,wobble:300,wet:.26,
        progs:[{ch:[[50,53,57,60,64],[53,59,64],[52,55,59,62],[55,61,64,70]],bs:[38,43,36,45]},
               {ch:[[52,55,59,62],[57,61,64,67],[50,53,57,60,64],[55,59,62,65]],bs:[40,45,38,43]}],
        play(i,t,ch,r){
          if(i===0||i===8)kick(t,.35);
          if([0,4,6,8,12,14].includes(i))nz(t,"highpass",5800,i%4===0?.05:.035,.28);
          if(i===4||i===12)brush(t);
          if(i===0)keys(t,ch,this.spb*1.6,1);
          if(i===6||(i===11&&Math.random()<.5))keys(t,ch,this.spb*.7,.6);
          if(i%4===0){const P=this.progs[prog%this.progs.length],nr=P.bs[(bar+1)%4];const walk=[r,r+7,r+10,nr+1][i/4];tone(t,walk,"triangle",.3,.01,this.spb*.85,0,music);}
          if(i%2===0&&Math.random()<.14)tone(t,pick([74,76,77,79,81,83,84,86]),"sine",.05,.015,this.spb*.55);
        }},
      noturna:{nome:"Noturna",bpm:60,swing:.2,cut:1300,wobble:250,wet:.55,
        progs:[{ch:[[57,60,64,67,71],[53,57,60,64],[50,53,57,60,64],[52,55,59,62]],bs:[45,41,38,40]},
               {ch:[[57,60,64,67],[55,59,62,66],[53,57,60,64],[52,56,59,62]],bs:[45,43,41,40]}],

        }},
      chip:{nome:"8-bit",bpm:118,swing:0,cut:6500,wobble:0,wet:.06,
        progs:[{ch:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],bs:[36,33,29,31]},

        play(i,t,ch,r){

    function init(ctx){
      if(c)return;c=ctx;

      const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.connect(master);

      const conv=c.createConvolver();conv.buffer=ir;wet=c.createGain();dry.connect(conv).connect(wet).connect(music);
      wow=c.createGain();wow.gain.value=7;const wo=c.createOscillator();wo.frequency.value=.55;wo.connect(wow);wo.start();

      init,ST,
      get station(){return cur},

      }

  // ---------- temas de cor ----------
  const THEMES={

    menta:{nome:"Menta",pomo:["#5fb3a0","#2b7563"],short:["#62a8c4","#2d6c86"],long:["#79b884","#3c7448"]},
    oceano:{nome:"Oceano",pomo:["#4f8fd1","#24589a"],short:["#45a3bf","#1d6780"],long:["#6c7fd6","#3a4aa0"]},
    sunset:{nome:"Pôr do sol",pomo:["#de8668","#a3442a"],short:["#dc9a52","#9a5a1c"],long:["#d77894","#983a57"]},
    morango:{nome:"Morango",pomo:["#de7389","#a1364e"],short:["#d488b0","#944573"],long:["#c287d3","#7a4291"]},
    noite:{nome:"Noite",pomo:["#3d3656","#3d3656"],short:["#2f3c58","#2f3c58"],long:["#4a3a5e","#4a3a5e"]},
    preto:{nome:"Preto",pomo:["#111111","#111111"],short:["#1c1c1f","#1c1c1f"],long:["#18161c","#18161c"]},
    branco:{nome:"Branco",pomo:["#ffffff","#6f55ad"],short:["#f6f6f9","#5662b0"],long:["#faf7fc","#8150a6"]}
  };
  function hexToHsl(h){const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let H=0,S=0;
    if(mx!==mn){const d=mx-mn;S=l>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60;}
    return[H,S*100,l*100];}
  const hsl=(h,s,l)=>`hsl(${((h%360)+360)%360} ${Math.round(s)}% ${Math.round(l)}%)`;
  function hslHex(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;
    const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
    return"#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("");}
  function lum(hex){const c=[1,3,5].map(i=>{const v=parseInt(hex.slice(i,i+2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
  function customTheme(hex){
    const [h,s,l]=hexToHsl(hex);
    const gray=s<8;                                   // preto, branco e cinzas: varia só o brilho
    const dl=l>85?-3:l<15?4:2;                        // pausas ficam um pouco mais claras/escuras
    const bg=(dh,k)=>gray?hslHex(h,s,l+dl*k):hslHex(h+dh,s,l+(k===1?2:0));
    const light=lum(hex)>.5;
    const acc=c=>{const [hh,ss,ll]=hexToHsl(c);return light?hslHex(hh,Math.min(ss,60),Math.min(ll,32)):(ll<28?c:hslHex(hh,ss+5,ll-26));};
    const P=hex,S=bg(-22,1),L=bg(24,2);
    return{nome:"Personalizada",pomo:[P,acc(P)],short:[S,acc(S)],long:[L,acc(L)]};
  }
  const lightModes={pomo:false,short:false,long:false};
  window.__isLight=m=>lightModes[m];
  let theme=store.get("capi-theme",{id:"lavanda",custom:"#a28bd4"});
  function applyTheme(){
    const t=theme.id==="custom"?customTheme(theme.custom):(THEMES[theme.id]||THEMES.lavanda);
    const r=document.documentElement.style;
    ["pomo","short","long"].forEach(m=>{r.setProperty("--bg-"+m,t[m][0]);r.setProperty("--acc-"+m,t[m][1]);lightModes[m]=lum(t[m][0])>.5;});
    if(typeof render==="function")render();
    const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute("content",t.pomo[0]);
    document.querySelectorAll(".theme").forEach(b=>b.setAttribute("aria-pressed",b.dataset.theme===theme.id));
  }
  function renderThemes(){
    const box=$("#themes");box.innerHTML="";
    const c=document.createElement("label");c.className="theme custom";c.dataset.theme="custom";c.setAttribute("for","theme-custom");
    c.innerHTML='<span class="sw"><input id="theme-custom" type="color" value="'+theme.custom+'" aria-label="Escolher cor personalizada"></span>Sua cor';
    box.appendChild(c);
    c.querySelector("input").addEventListener("input",e=>{theme={id:"custom",custom:e.target.value};store.set("capi-theme",theme);applyTheme();});
    Object.entries(THEMES).forEach(([id,t])=>{
      const b=document.createElement("button");b.type="button";b.className="theme";b.dataset.theme=id;
      b.innerHTML='<span class="sw" style="background:conic-gradient('+t.pomo[0]+' 0 33%,'+t.short[0]+' 0 66%,'+t.long[0]+' 0)"></span>'+t.nome;
      b.addEventListener("click",()=>{theme.id=id;store.set("capi-theme",theme);applyTheme();});
      box.appendChild(b);
    });
  }
  // carrossel de temas
  function themeNav(){const b=$("#themes"),max=b.scrollWidth-b.clientWidth-2;
    $("#th-prev").hidden=b.scrollLeft<=2;$("#th-next").hidden=b.scrollLeft>=max;
    b.style.setProperty("--fl",b.scrollLeft>2?"28px":"0px");b.style.setProperty("--fr",b.scrollLeft<max?"28px":"0px");}
  function themeStep(dir){const b=$("#themes");b.scrollBy({left:dir*Math.max(140,b.clientWidth*.7),behavior:"smooth"});}
  $("#th-prev").addEventListener("click",()=>themeStep(-1));$("#th-next").addEventListener("click",()=>themeStep(1));
  $("#themes").addEventListener("scroll",themeNav,{passive:true});window.addEventListener("resize",themeNav);
  function showActiveTheme(){const b=$("#themes"),a=b.querySelector('[aria-pressed="true"]');
    b.style.scrollBehavior="auto";b.scrollLeft=0;if(a){const r=a.offsetLeft-b.offsetLeft+a.offsetWidth+36;if(r>b.clientWidth)b.scrollLeft=r-b.clientWidth;}b.style.scrollBehavior="";themeNav();}
  $("#btn-settings").addEventListener("click",()=>requestAnimationFrame(showActiveTheme));
  renderThemes();applyTheme();
  renderTasks();render();
})();
</script>
</body>
