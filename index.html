<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Timer pomodoro com uma capivara street e lo-fi gerado no navegador.">
<meta name="theme-color" content="#a28bd4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23a28bd4'/%3E%3Cpath d='M9 21 C9 13 14 10 20 10 C26 10 31 13 31 21 L31.5 26 C31.5 31 26 34 20 34 C14 34 8.5 31 8.5 26 Z' fill='%23b57e52'/%3E%3Cellipse cx='20' cy='28' rx='8' ry='5' fill='%239a643c'/%3E%3Crect x='16' y='24' width='8' height='3.6' rx='1.8' fill='%233a2416'/%3E%3Ccircle cx='15' cy='20' r='1.5' fill='%2322140b'/%3E%3Ccircle cx='25' cy='20' r='1.5' fill='%2322140b'/%3E%3Cpath d='M12 14 C12 6 28 6 28 14 Z' fill='%23f2c14e'/%3E%3Cellipse cx='20' cy='14' rx='12' ry='2.6' fill='%23e3ad35'/%3E%3C/svg%3E">
<title>Capifocus</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/mascot.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">

</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#fff"/><path d="M9 21 C9 13 14 10 20 10 C26 10 31 13 31 21 L31.5 26 C31.5 31 26 34 20 34 C14 34 8.5 31 8.5 26 Z" fill="#b57e52"/><ellipse cx="20" cy="28" rx="8" ry="5" fill="#9a643c"/><rect x="16" y="24" width="8" height="3.6" rx="1.8" fill="#3a2416"/><circle cx="15" cy="20" r="1.5" fill="#22140b"/><circle cx="25" cy="20" r="1.5" fill="#22140b"/><path d="M12 14 C12 6 28 6 28 14 Z" fill="#f2c14e"/><ellipse cx="20" cy="14" rx="12" ry="2.6" fill="#e3ad35"/></svg>
      Capifocus
    </div>
    <div class="hbtns">
      <button class="hbtn icon" id="btn-settings" type="button" aria-controls="settings-wrap" aria-expanded="false" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <div class="settings-wrap" id="settings-wrap"><div class="sback" id="sback"></div><div class="sclip">
  <section class="settings" id="settings" aria-label="Ajustes">
    <h3>Tempo (minutos)</h3>
    <div class="srow">
      <label for="set-pomo">Pomodoro<input id="set-pomo" type="number" min="1" max="120" value="25"></label>
      <label for="set-short">Pausa curta<input id="set-short" type="number" min="1" max="60" value="5"></label>
      <label for="set-long">Pausa longa<input id="set-long" type="number" min="1" max="60" value="15"></label>
    </div>
    <h3>Tema</h3>
    <div class="tcar" id="tcar">
      <button class="tnav prev" id="th-prev" type="button" aria-label="Temas anteriores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="themes" id="themes" role="group" aria-label="Cor de fundo"></div>
      <button class="tnav next" id="th-next" type="button" aria-label="Próximos temas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <h3>Alarme</h3>
    <div class="arow">
      <label for="al-sound">Som<select id="al-sound"><option value="sino">Sininho</option><option value="marimba">Marimba</option><option value="capi">Capi jingle</option><option value="despertador">Despertador</option></select></label>
      <label for="al-rep">Repetir<input id="al-rep" type="number" min="1" max="10" value="3"></label>
      <label for="al-vol">Volume<input id="al-vol" type="range" min="0" max="100" value="80"></label>
      <button class="btn-test" id="al-test" type="button">Testar</button>
    </div>
    <div class="frow"><button class="btn-dark" id="save-settings" type="button">Salvar</button></div>
  </section>
  </div></div>

  <section class="card" aria-label="Timer">
    <div class="tabs" role="group" aria-label="Modo">
      <button class="tab" data-mode="pomo" aria-pressed="true" type="button">Pomodoro</button>
      <button class="tab" data-mode="short" aria-pressed="false" type="button">Pausa curta</button>
      <button class="tab" data-mode="long" aria-pressed="false" type="button">Pausa longa</button>
    </div>
    <div class="time" id="time" aria-live="off">25:00</div>
    <div class="controls">
      <button class="skip reset" id="reset" type="button" aria-label="Reiniciar tempo" title="Reiniciar tempo" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
      </button>
      <button class="main" id="main" type="button">Começar</button>
      <button class="skip" id="skip" type="button" aria-label="Pular para a próxima etapa" title="Pular para a próxima etapa" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4.5v15a1 1 0 0 0 1.55.83l11-7.5a1 1 0 0 0 0-1.66l-11-7.5A1 1 0 0 0 5 4.5z"/><rect x="18.5" y="4" width="2.5" height="16" rx="1"/></svg>
      </button>
    </div>
  </section>
  <div class="player" id="player" aria-label="Capi Rádio">
    <button class="play" id="mus-play" type="button" aria-label="Tocar lo-fi">
      <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/></svg>
    </button>
    <div class="pinfo">
      <b>Capi Rádio <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></b>
      <div class="tuner">
        <button class="tbtn" id="st-prev" type="button" aria-label="Estação anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span class="st-name" id="st-name" aria-live="polite">Lo-fi clássico</span>
        <button class="tbtn" id="st-next" type="button" aria-label="Próxima estação"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <span id="mus-status">Toca junto com o timer</span>
    </div>
    <div class="pctl">
      <label class="vol" for="snd-vol">Vol <input id="snd-vol" type="range" min="0" max="100" value="55"></label>
      <label class="switch" for="mus-breaks"><input id="mus-breaks" type="checkbox"> Tocar nas pausas</label>
    </div>
  </div>

  <div class="capy-stage">
    <div class="cheer" id="cheer" role="status" aria-live="polite">Tarefa concluída!</div>
    <svg class="capy" viewBox="0 0 240 165" role="img" aria-label="Capivara de chapéu bucket e moletom">
      <defs>
        <radialGradient id="fur" cx=".45" cy=".35" r=".75"><stop offset="0" stop-color="#c99566"/><stop offset="1" stop-color="#a87148"/></radialGradient>
      </defs>
      <ellipse cx="120" cy="159" rx="72" ry="6" fill="rgba(0,0,0,.14)"/>
      <g class="breath">
        <!-- moletom -->
        <ellipse cx="120" cy="104" rx="44" ry="12" fill="#3d3058"/>
        <path d="M62 150 C58 116 78 96 120 96 C162 96 182 116 178 150 C170 158 70 158 62 150 Z" fill="#2b2140"/>
        <path d="M96 130 H144 L139 148 H101 Z" fill="#241b38" stroke="#3d3058" stroke-width="2" stroke-linejoin="round"/>
        <g stroke="#ece8f5" stroke-width="2.4" stroke-linecap="round"><path d="M112 104 L110 122"/><path d="M128 104 L130 122"/></g>
        <!-- corrente -->
        <path d="M94 101 Q120 128 146 101" stroke="#f2c14e" stroke-width="3.2" fill="none" stroke-dasharray="4 2"/>
        <circle cx="120" cy="116" r="7" fill="#f2c14e" stroke="#c9952a" stroke-width="1.5"/>
        <text x="120" y="119.5" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="9" fill="#8a5f12">C</text>
        <!-- mãos -->
        <ellipse cx="72" cy="132" rx="10" ry="11" fill="url(#fur)"/>
        <ellipse cx="168" cy="132" rx="10" ry="11" fill="url(#fur)"/>
        <path d="M63 124 q9 -5 18 0 M159 124 q9 -5 18 0" stroke="#3d3058" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- tênis -->
        <g>
          <rect x="80" y="144" width="36" height="15" rx="7.5" fill="#fff"/>
          <rect x="124" y="144" width="36" height="15" rx="7.5" fill="#fff"/>
          <path d="M82 155 h32 M126 155 h32" stroke="#e07a9b" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M92 147 l6 3 M98 146 l6 3 M136 146 l6 3 M142 147 l6 3" stroke="#bdb3d3" stroke-width="1.6" stroke-linecap="round"/>
        </g>
        <g class="head">
          <!-- orelhas -->
          <ellipse cx="82" cy="44" rx="7" ry="6.5" fill="#94603a"/>
          <ellipse cx="158" cy="44" rx="7" ry="6.5" fill="#94603a"/>
          <ellipse cx="83" cy="45" rx="3.4" ry="3" fill="#6e4428"/>
          <ellipse cx="157" cy="45" rx="3.4" ry="3" fill="#6e4428"/>
          <!-- cabeça -->
          <path d="M78 58 C78 32 98 22 120 22 C142 22 162 32 162 58 L164 78 C164 96 146 106 120 106 C94 106 76 96 76 78 Z" fill="url(#fur)"/>
          <ellipse cx="120" cy="83" rx="34" ry="22" fill="#9a643c"/>
          <rect x="105" y="70" width="30" height="13" rx="6.5" fill="#3a2416"/>
          <ellipse cx="113" cy="74" rx="3" ry="1.6" fill="#6e4a33"/>
          <ellipse cx="127" cy="74" rx="3" ry="1.6" fill="#6e4a33"/>
          <path class="mouth" d="M111 91 q4.5 4.5 9 0 q4.5 4.5 9 0" stroke="#3a2416" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <ellipse cx="90" cy="76" rx="7" ry="4" fill="#ef8fa3" opacity=".5"/>
          <ellipse cx="150" cy="76" rx="7" ry="4" fill="#ef8fa3" opacity=".5"/>
          <!-- olhos -->
          <g class="eye-open">
            <ellipse cx="98" cy="58" rx="4.6" ry="5.4" fill="#22140b"/>
            <ellipse cx="142" cy="58" rx="4.6" ry="5.4" fill="#22140b"/>
            <circle cx="99.8" cy="56" r="1.7" fill="#fff"/><circle cx="143.8" cy="56" r="1.7" fill="#fff"/>
          </g>
          <g class="eye-closed" stroke="#22140b" stroke-width="2.6" fill="none" stroke-linecap="round">
            <path d="M92 58 q6 5 12 0"/><path d="M136 58 q6 5 12 0"/>
          </g>
          <!-- bucket hat -->
          <path d="M87 36 C88 12 152 12 153 36 Z" fill="#f2c14e"/>
          <path d="M88 31 H152" stroke="#2b2140" stroke-width="4.5"/>
          <ellipse cx="120" cy="37" rx="47" ry="8.5" fill="#e3ad35"/>
          <path d="M104 18 q8 -3 16 -3" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".5"/>
          <!-- óculos escuros (pausa longa) -->
          <g class="prop prop-long">
            <rect x="85" y="49" width="27" height="16" rx="7" fill="#1d1530"/>
            <rect x="128" y="49" width="27" height="16" rx="7" fill="#1d1530"/>
            <path d="M112 54 h16" stroke="#1d1530" stroke-width="3"/>
            <path d="M89 53 l7 0 M132 53 l7 0" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".5"/>
          </g>
          <!-- fone (pomodoro) -->
          <g class="prop prop-pomo">
            <path d="M74 62 C70 4 170 4 166 62" stroke="#e07a9b" stroke-width="6" fill="none" stroke-linecap="round"/>
            <rect x="64" y="48" width="17" height="27" rx="8.5" fill="#e07a9b" stroke="#2b2140" stroke-width="2.5"/>
            <rect x="159" y="48" width="17" height="27" rx="8.5" fill="#e07a9b" stroke="#2b2140" stroke-width="2.5"/>
          </g>
        </g>
      </g>

      <!-- Pomodoro: curtindo o som -->
      <g class="prop prop-pomo" fill="var(--ink)" font-family="Fredoka,sans-serif" font-weight="700">
        <text class="note" x="186" y="52" font-size="20">♪</text>
        <text class="note" x="36" y="62" font-size="18">♫</text>
        <text class="note" x="200" y="86" font-size="14">♪</text>
      </g>

      <!-- Pausa curta: bubble tea -->
      <g class="prop prop-short">
        <path d="M172 98 L130 90" stroke="#f2c14e" stroke-width="4" stroke-linecap="round"/>
        <path d="M157 100 H181 L177 134 H161 Z" fill="rgba(255,255,255,.85)"/>
        <path d="M158.2 110 H179.8 L177 134 H161 Z" fill="#c9a27a"/>
        <g class="boba" fill="#3a2416"><circle cx="164" cy="129" r="2.6"/><circle cx="170" cy="130" r="2.6"/><circle cx="175" cy="128" r="2.6"/><circle cx="167" cy="124" r="2.6"/><circle cx="173" cy="123" r="2.6"/></g>
        <rect x="155" y="96" width="28" height="6" rx="3" fill="#e07a9b"/>
        <ellipse cx="160" cy="124" rx="9.5" ry="10.5" fill="url(#fur)"/>
        <g fill="#ffd6e4">
          <path class="heart" d="M196 62 c-3-4-9-1-6 4 l6 5 6-5 c3-5-3-8-6-4z"/>
          <path class="heart" d="M210 78 c-2-3-7-1-5 3 l5 4 5-4 c2-4-3-6-5-3z"/>
        </g>
      </g>

      <!-- Pausa longa: ofurô -->
      <g class="prop prop-long">
        <rect x="40" y="110" width="160" height="50" rx="9" fill="#c98b55"/>
        <rect x="40" y="106" width="160" height="9" rx="4.5" fill="#9fd3e6"/>
        <rect x="40" y="122" width="160" height="4" fill="#8a5b37"/>
        <rect x="40" y="145" width="160" height="4" fill="#8a5b37"/>
        <g stroke="#b07646" stroke-width="1.5"><path d="M72 115v45M104 115v45M136 115v45M168 115v45"/></g>
        <g>
          <g class="float"><circle cx="66" cy="107" r="7.5" fill="var(--yuzu)"/></g>
          <g class="float"><circle cx="176" cy="108" r="6.5" fill="var(--yuzu)"/></g>
        </g>
        <g stroke="var(--ink)" stroke-width="2.4" fill="none" stroke-linecap="round">
          <path class="steam" d="M54 96 q-5 -6 0 -12 q5 -6 0 -12"/>
          <path class="steam" d="M188 96 q-5 -6 0 -12 q5 -6 0 -12"/>
          <path class="steam" d="M204 100 q-5 -6 0 -12 q5 -6 0 -12"/>
        </g>
        <text class="zzz" x="176" y="30" font-size="18">z</text>
        <text class="zzz" x="190" y="18" font-size="13">z</text>
      </g>
    </svg>
    <div class="doing" id="doing">Esperando você</div>
    <div class="count" id="count">#1</div>
    <div class="msg" id="msg">Hora de focar!</div>
  </div>

  <section>
    <div class="tasks-head"><h2>Tarefas</h2></div>
    <ul class="tasks" id="tasks" style="margin-top:16px"></ul>
    <form class="newtask" id="newtask" hidden style="margin-top:8px">
      <input id="nt-name" type="text" placeholder="No que você vai trabalhar?" autocomplete="off" required>
      <label for="nt-est">Pomodoros estimados <input id="nt-est" type="number" min="1" max="20" value="1"></label>
      <div class="frow"><button type="button" class="btn-ghost" id="nt-cancel">Cancelar</button><button type="submit" class="btn-dark">Salvar</button></div>
    </form>
    <button class="add" id="add" type="button" style="margin-top:10px">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 7v10M7 12h10" stroke="var(--bg)" stroke-width="2.6" stroke-linecap="round"/></svg>
      Adicionar tarefa
    </button>
    <div class="summary" id="summary" style="margin-top:22px"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <footer>Feito com calma de capivara.</footer>
</div>

<script src="js/components/mascot.js"></script>
<script src="js/app.js"></script>
</body>
</html>
